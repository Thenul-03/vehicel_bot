<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Bot Local Host</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 85px; background: #f8f9fa; }
        .nav-link.active { font-weight: 700; }
        .report-card { margin-bottom: 1rem; }
        .chat-message.user { text-align: right; }
        .chat-message.assistant { text-align: left; }
        .chat-bubble { display: inline-block; padding: 0.85rem 1rem; border-radius: 1rem; margin-bottom: 0.5rem; max-width: 90%; }
        .chat-bubble.user { background: #0d6efd; color: white; }
        .chat-bubble.assistant { background: #e9ecef; color: #212529; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('index') }}">Vehicle Bot Local</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link {% if active_tab == 'report' %}active{% endif %}" href="{{ url_for('index', tab='report') }}">Report</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_tab == 'chat' %}active{% endif %}" href="{{ url_for('index', tab='chat') }}">AI Chat</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="alert alert-{{ 'warning' if category == 'warning' else category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
